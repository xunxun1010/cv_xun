<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>easy-cv 编辑器</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="editor-page">
      <section class="editor-panel">
        <div class="toolbar">
          <h1>编辑：{{ current_file }}</h1>
          <div style="display:flex;align-items:center;gap:8px;">
            {% if all_files|length > 1 %}
            <select id="fileSwitcher" style="padding:6px 8px;border-radius:6px;border:1px solid #ccc;font-size:13px;">
              {% for f in all_files %}
              <option value="{{ f }}" {% if f == current_file %}selected{% endif %}>{{ f }}</option>
              {% endfor %}
            </select>
            {% endif %}
            <button id="saveBtn">保存</button>
            <a href="/" target="_blank">首页</a>
          </div>
        </div>
        <textarea id="yamlInput">{{ yaml_text }}</textarea>
        <p id="status">Ctrl+S 保存</p>
      </section>
      <section class="preview-panel">
        <iframe id="previewFrame" src="/resume?file={{ current_file }}" title="简历预览"></iframe>
      </section>
    </main>

    <script>
      const currentFile = "{{ current_file }}";
      const saveBtn = document.getElementById("saveBtn");
      const yamlInput = document.getElementById("yamlInput");
      const statusText = document.getElementById("status");
      const previewFrame = document.getElementById("previewFrame");
      const fileSwitcher = document.getElementById("fileSwitcher");

      function refreshPreview() {
        previewFrame.src = "/resume?file=" + encodeURIComponent(currentFile) + "&t=" + Date.now();
      }

      // File switcher
      if (fileSwitcher) {
        fileSwitcher.addEventListener("change", () => {
          window.location.href = "/editor?file=" + encodeURIComponent(fileSwitcher.value);
        });
      }

      saveBtn.addEventListener("click", async () => {
        statusText.textContent = "保存中...";
        try {
          const resp = await fetch("/api/resume/raw?file=" + encodeURIComponent(currentFile), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ yaml_text: yamlInput.value }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "保存失败");
          statusText.textContent = "已保存 " + new Date().toLocaleTimeString();
          refreshPreview();
        } catch (err) {
          statusText.textContent = "保存失败：" + err.message;
        }
      });

      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          saveBtn.click();
        }
      });
    </script>
  </body>
</html>
